name: Run Unit Tests

on:
  # 1. Automatically run on pushes to main
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/**.md' # Optional: Ignores READMEs in subdirectories
  # 2. Automatically run on incoming Pull Requests targeting main
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/**.md' # Optional: Ignores READMEs in subdirectories
      
  # 3. Allow manual execution on ANY branch via GitHub UI
  workflow_dispatch:

jobs:
  pytest:
    name: ${{ matrix.apprise == 'latest' && 'Run Pytest Suite' || 'Apprise Minimum Compatibility' }}
    strategy:
      fail-fast: false
      matrix:
        apprise: [minimum, latest]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov requests

      - name: Check minimum Apprise compatibility
        if: matrix.apprise == 'minimum'
        run: python -m pip install 'Apprise==1.13.1'

      - name: Check latest Apprise compatibility
        if: matrix.apprise == 'latest'
        run: python -m pip install --upgrade apprise

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest unittests/ -vs --cov=CheckRoyalCaribbeanPrice --cov=BrowseRoyalCaribbeanPrice --cov-report=term-missing
